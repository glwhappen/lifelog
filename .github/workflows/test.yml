name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lifelog
          POSTGRES_USER: lifelog
          POSTGRES_PASSWORD: lifelog
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lifelog -d lifelog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://lifelog:lifelog@localhost:5432/lifelog
      TEST_DATABASE_URL: postgres://lifelog:lifelog@localhost:5432/lifelog
      SESSION_SECRET: ci-session-secret-0123456789abcdefghijklmnop
      DEFAULT_TIMEZONE: Asia/Shanghai
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 执行数据库迁移
        run: npm run migrate

      - name: 测试（单元 + 集成）
        run: npm test

      - name: 构建
        run: npm run build
